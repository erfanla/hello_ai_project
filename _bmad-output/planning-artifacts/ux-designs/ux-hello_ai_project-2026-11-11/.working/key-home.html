<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key screen — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* KEY SCREEN: Home
   Governed by (spine still empty — memlog decisions):
   - IA approved: Home = 'Waiting for your answer' ALWAYS on top, then My Plans, big New plan button. Max 2 taps from Home.
   - Ali must find a pending Invitation right away after reopening the app.
   - Color package 1 Notte Pura; typography: big serif headlines + clean sans.
   - PRD FR-6 (Open Invitations), FR-15 (Draft, only Inviter sees it), FR-16 (My Plans + Updated mark), FR-9 (no Answers of others shown).
   States: (a) normal with 2 pending, (b) empty Home. */
/* ---- Notte Pura tokens (package 1, color-themes-1.html) — exact hex ----
   Fonts (exception to the brief, approved typography decision):
   - Headlines: "Gloock" (Google Fonts) — high-contrast, elegant display serif; rarer than Playfair/DM Serif.
   - Body, times, buttons: "Onest" (Google Fonts) — clean, friendly sans with clear numbers.
   Avatar = emoji face on a soft gradient shape (memlog: Faces v1 option 2). No initials.
   Roster: Ali 🐙 a3/sh3 (the viewer) · Soroush 🦊 a0/sh0 · Sara 🐸 a1/sh1 · Reza 🐻 a2/sh2 · Leila 🦄 a4/sh4
   Amber (--yes) is kept for Yes, celebration and Publish only. */
:root{--bg:#000000;--sf:#141414;--tx:#FFFFFF;--mu:#A3A3A3;--ln:#2B2B2B;--yes:#FFB547;--yt:#000000;--no:#1F1F1F;--nt:#FFFFFF;
--a0:linear-gradient(135deg,#FFD25E,#FF9A1F);--a1:linear-gradient(135deg,#4FE3A5,#18B877);--a2:linear-gradient(135deg,#7D95FF,#8A5CFF);--a3:linear-gradient(135deg,#FF7A6B,#FF4F8B);--a4:linear-gradient(135deg,#F7F2E8,#CFC6B4);
--serif:"Gloock",ui-serif,Georgia,serif;--sans:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);padding:40px 16px 96px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.page-h{max-width:1560px;margin:0 auto 40px}
.page-h h1{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.1}
.page-h p{color:var(--mu);margin-top:8px;max-width:720px;line-height:1.5;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:48px 40px;justify-content:center;align-items:flex-start;max-width:1560px;margin:0 auto}
figure{width:360px;max-width:100%}
figcaption{color:var(--mu);font-size:14px;line-height:1.5;margin-top:16px}
figcaption b{color:var(--tx);display:block;font-weight:600;margin-bottom:2px}
.phone{width:360px;max-width:100%;min-height:760px;background:var(--bg);border:1px solid var(--ln);border-radius:40px;padding:14px 20px 24px;position:relative;display:flex;flex-direction:column}
.status{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:14px;padding:0 8px}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
.mu{color:var(--mu)}
.lbl{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);font-weight:600}
.av{display:inline-grid;place-items:center;width:40px;height:40px;font-size:22px;line-height:1;flex:none}
.av.s{width:28px;height:28px;font-size:15px}
.sh0{border-radius:50%}.sh1{border-radius:50% 50% 50% 10px}.sh2{border-radius:50% 50% 14px 14px}.sh3{border-radius:14px}.sh4{border-radius:50% 10px 50% 10px}
.av.s.sh1{border-radius:50% 50% 50% 7px}.av.s.sh2{border-radius:50% 50% 9px 9px}.av.s.sh3{border-radius:9px}.av.s.sh4{border-radius:50% 7px 50% 7px}
.g0{background:var(--a0)}.g1{background:var(--a1)}.g2{background:var(--a2)}.g3{background:var(--a3)}.g4{background:var(--a4)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:999px;font:600 17px/1 var(--sans);border:0;width:100%;cursor:pointer;text-decoration:none}
.btn.yes{background:var(--yes);color:var(--yt)}
.btn.no{background:var(--no);color:var(--nt)}
.btn.white{background:#FFFFFF;color:#000000}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--ln)}
.btn.text{background:transparent;color:var(--mu);min-height:44px;font-weight:500;font-size:15px}
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--mu);font-size:15px;text-decoration:none;gap:6px}
.replay{margin-top:14px;min-height:44px;padding:0 20px;border-radius:999px;background:var(--no);color:var(--tx);border:1px solid var(--ln);font:600 14px var(--sans);cursor:pointer}

.hello{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 26px}
.hello h2{font-size:40px;line-height:1}
.hello .day{font-size:14px;margin-bottom:6px}
.sec{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.count{min-width:22px;height:22px;border-radius:999px;background:var(--tx);color:#000;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 7px}
.inv{display:block;background:var(--sf);border:1px solid var(--ln);border-radius:24px;padding:16px;margin-bottom:10px;color:inherit;text-decoration:none}
.inv .top{display:flex;gap:14px;align-items:center}
.tile{width:56px;height:56px;border-radius:18px;background:#1F1F1F;display:grid;place-items:center;font-size:32px;flex:none}
.inv h3{font-size:24px;line-height:1.1}
.inv .meta{font-size:14px;margin-top:4px}
.inv .bot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--ln);font-size:14px}
.going{display:flex;align-items:center;gap:8px}
.stack{display:flex}.stack .av{border:2px solid var(--sf)}.stack .av+.av{margin-left:-8px}
.left{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.left i{width:7px;height:7px;border-radius:50%;background:var(--tx)}
.plans{margin-top:22px}
.plan{display:flex;gap:12px;align-items:center;min-height:64px;padding:10px 0;border-bottom:1px solid var(--ln);color:inherit;text-decoration:none}
.plan:last-child{border-bottom:0}
.plan .tile{width:44px;height:44px;border-radius:14px;font-size:24px}
.plan .t{font-weight:600;font-size:16px}
.plan .s{font-size:13px;margin-top:3px}
.plan .end{margin-left:auto;flex:none}
.upd{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:#1F1F1F;border:1px solid var(--ln);border-radius:999px;padding:5px 10px}
.upd i{width:6px;height:6px;border-radius:50%;background:var(--tx)}
.draft{font-size:12px;font-weight:600;color:var(--mu);border:1px dashed var(--ln);border-radius:999px;padding:5px 10px}
.newplan{margin-top:auto;padding-top:20px}
.newplan .btn{min-height:60px;font-size:18px}
.plus{font-size:22px;font-weight:400;margin-top:-2px}
/* empty state */
.empty{border:1px solid var(--ln);border-radius:24px;padding:28px 20px 24px;text-align:center;position:relative;overflow:hidden}
.shapes{position:relative;height:96px;margin-bottom:14px}
.shapes span{position:absolute;opacity:.9}
.empty h3{font-size:30px;line-height:1.1}
.empty p{margin-top:6px;font-size:15px}
.calmline{font-size:14px;padding:14px 0}
</style>
</head>
<body>
<header class="page-h">
  <h1>Home</h1>
  <p>The start screen. Invitations that wait for your answer are always on top, so you never have to search. One tap opens the Invitation, one more tap answers it.</p>
</header>
<div class="row">

<figure>
  <div class="phone">
    <div class="status"><span>19:18</span><span>●●● ▮</span></div>
    <div class="hello">
      <div><p class="day mu">Friday evening</p><h2 class="serif">Hi Ali</h2></div>
      <span class="av g3 sh3" aria-label="Your avatar">🐙</span>
    </div>

    <div class="sec"><span class="lbl">Waiting for your answer</span><span class="count">2</span></div>

    <a class="inv" href="#">
      <div class="top">
        <div class="tile">🍔</div>
        <div><h3 class="serif">Burger tonight</h3><p class="meta mu">Soroush · Fri 21 Nov, 20:00</p></div>
      </div>
      <div class="bot">
        <span class="going"><span class="stack"><span class="av s g1 sh1">🐸</span><span class="av s g2 sh2">🐻</span></span><span class="mu">2 going</span></span>
        <span class="left"><i></i>42 min left</span>
      </div>
    </a>

    <a class="inv" href="#">
      <div class="top">
        <div class="tile">🍣</div>
        <div><h3 class="serif">Sushi Sunday</h3><p class="meta mu">Leila · Sun 23 Nov, 13:00</p></div>
      </div>
      <div class="bot">
        <span class="going"><span class="stack"><span class="av s g0 sh0">🦊</span></span><span class="mu">1 going</span></span>
        <span class="left"><i></i>5 h left</span>
      </div>
    </a>

    <div class="plans">
      <div class="sec"><span class="lbl">My Plans</span></div>
      <a class="plan" href="#">
        <div class="tile">☕</div>
        <div><div class="t">Coffee tomorrow</div><div class="s mu">Sara's plan · Sat 22 Nov, 10:30 · You're in</div></div>
        <span class="end upd"><i></i>Updated</span>
      </a>
      <a class="plan" href="#">
        <div class="tile">🎬</div>
        <div><div class="t">Movie night</div><div class="s mu">Your plan · only you can see it</div></div>
        <span class="end draft">Draft</span>
      </a>
    </div>

    <div class="newplan"><a class="btn white" href="#"><span class="plus">+</span>New plan</a></div>
  </div>
  <figcaption><b>a · Two Invitations waiting</b>Pending Invitations sit on top with who invited, when, who is going, and time left (said plainly, no red, no alarm). My Plans below: a Yes plan with an Updated mark, and a Draft only Ali sees.</figcaption>
</figure>

<figure>
  <div class="phone">
    <div class="status"><span>10:02</span><span>●●● ▮</span></div>
    <div class="hello">
      <div><p class="day mu">Saturday morning</p><h2 class="serif">Hi Ali</h2></div>
      <span class="av g3 sh3" aria-label="Your avatar">🐙</span>
    </div>

    <div class="sec"><span class="lbl">Waiting for your answer</span></div>
    <div class="empty">
      <div class="shapes" aria-hidden="true">
        <span class="g0" style="width:58px;height:58px;border-radius:50%;left:calc(50% - 92px);top:22px"></span>
        <span class="g2" style="width:70px;height:70px;border-radius:50% 50% 18px 18px;left:calc(50% - 35px);top:4px"></span>
        <span class="g1" style="width:48px;height:48px;border-radius:50% 50% 50% 10px;left:calc(50% + 44px);top:36px"></span>
      </div>
      <h3 class="serif">Nothing waiting.</h3>
      <p class="mu">Start a plan?</p>
    </div>

    <div class="plans">
      <div class="sec"><span class="lbl">My Plans</span></div>
      <p class="calmline mu">Plans you make or say Yes to will show here.</p>
    </div>

    <div class="newplan"><a class="btn white" href="#"><span class="plus">+</span>New plan</a></div>
  </div>
  <figcaption><b>b · Empty Home</b>Nothing to answer. A calm, friendly empty state with soft gradient shapes, and the New plan button still one tap away.</figcaption>
</figure>

</div>
</body>
</html>
