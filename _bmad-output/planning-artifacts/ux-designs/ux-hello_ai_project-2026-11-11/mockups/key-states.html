<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key screen — Invitation page — other states</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* KEY SCREEN: Invitation page — other states
   Governed by: EXPERIENCE.md State Patterns (Cancelled, Deadline passed no answer, Inviter Closed with Yes, Inviter Closed empty,
   Draft, Time window), Voice table; DESIGN.md status-banner, empty-state, draft-tag, button-yes/button-no (same size).
   PRD FR-10, FR-13, FR-15, FR-4 (time window); architecture AD-3 (Notes allowed when Cancelled; Edit allowed when Closed before when_start, Cancel allowed when Open or Closed),
   AD-4 (when_end set = time window). Silent No: never show who said No or the Guest List; no 'Change answer'.
   [ASSUMPTION] Closed for an Invitee hides the Going row; Draft offers Delete draft. */
/* ---- Notte Pura tokens (package 1, color-themes-1.html) — exact hex ----
   Fonts (exception to the brief, approved typography decision):
   - Headlines: "Gloock" (Google Fonts) — high-contrast, elegant display serif; rarer than Playfair/DM Serif.
   - Body, times, buttons: "Onest" (Google Fonts) — clean, friendly sans with clear numbers.
   Avatar = emoji face on a soft gradient shape (memlog: Faces v1 option 2). No initials.
   Roster: Ali 🐙 a3/sh3 (the viewer) · Soroush 🦊 a0/sh0 · Sara 🐸 a1/sh1 · Reza 🐻 a2/sh2 · Leila 🦄 a4/sh4
   Amber (--yes) is kept for Yes, celebration and Publish only. */
:root{--bg:#000000;--sf:#141414;--tx:#FFFFFF;--mu:#A3A3A3;--ln:#2B2B2B;--yes:#FFB547;--yt:#000000;--no:#1F1F1F;--nt:#FFFFFF;
--a0:linear-gradient(135deg,#FFD25E,#FF9A1F);--a1:linear-gradient(135deg,#4FE3A5,#18B877);--a2:linear-gradient(135deg,#7D95FF,#8A5CFF);--a3:linear-gradient(135deg,#FF7A6B,#FF4F8B);--a4:linear-gradient(135deg,#F7F2E8,#CFC6B4);
--serif:"Gloock",ui-serif,Georgia,serif;--sans:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);padding:40px 16px 96px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.page-h{max-width:1560px;margin:0 auto 40px}
.page-h h1{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.1}
.page-h p{color:var(--mu);margin-top:8px;max-width:720px;line-height:1.5;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:48px 40px;justify-content:center;align-items:flex-start;max-width:1560px;margin:0 auto}
figure{width:360px;max-width:100%}
figcaption{color:var(--mu);font-size:14px;line-height:1.5;margin-top:16px}
figcaption b{color:var(--tx);display:block;font-weight:600;margin-bottom:2px}
.phone{width:360px;max-width:100%;min-height:760px;background:var(--bg);border:1px solid var(--ln);border-radius:40px;padding:14px 20px 24px;position:relative;display:flex;flex-direction:column}
.status{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:14px;padding:0 8px}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
.mu{color:var(--mu)}
.lbl{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);font-weight:600}
.av{display:inline-grid;place-items:center;width:40px;height:40px;font-size:22px;line-height:1;flex:none}
.av.s{width:28px;height:28px;font-size:15px}
.sh0{border-radius:50%}.sh1{border-radius:50% 50% 50% 10px}.sh2{border-radius:50% 50% 14px 14px}.sh3{border-radius:14px}.sh4{border-radius:50% 10px 50% 10px}
.av.s.sh1{border-radius:50% 50% 50% 7px}.av.s.sh2{border-radius:50% 50% 9px 9px}.av.s.sh3{border-radius:9px}.av.s.sh4{border-radius:50% 7px 50% 7px}
.g0{background:var(--a0)}.g1{background:var(--a1)}.g2{background:var(--a2)}.g3{background:var(--a3)}.g4{background:var(--a4)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:999px;font:600 17px/1 var(--sans);border:0;width:100%;cursor:pointer;text-decoration:none}
.btn.yes{background:var(--yes);color:var(--yt)}
.btn.no{background:var(--no);color:var(--nt)}
.btn.white{background:#FFFFFF;color:#000000}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--ln)}
.btn.text{background:transparent;color:var(--mu);min-height:44px;font-weight:500;font-size:15px}
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--mu);font-size:15px;text-decoration:none;gap:6px}
.replay{margin-top:14px;min-height:44px;padding:0 20px;border-radius:999px;background:var(--no);color:var(--tx);border:1px solid var(--ln);font:600 14px var(--sans);cursor:pointer}

/* ---- kit shared by the new mocks (same values as the first 4 mocks) ---- */
.h-xl{font-size:46px;line-height:1}.h-lg{font-size:42px;line-height:1}.h-md{font-size:36px;line-height:1.05}.h-sm{font-size:30px;line-height:1.1}.h-t{font-size:24px;line-height:1.1}
.lead{font-size:15px;line-height:1.45;margin-top:10px;color:var(--mu)}
.btn.lg{min-height:58px;font-size:18px}
.topx{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--mu);background:transparent;border:1px solid var(--ln);cursor:pointer}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:transparent;color:var(--tx);display:grid;place-items:center;cursor:pointer;text-decoration:none;flex:none}
.icon-btn svg{width:22px;height:22px}
.field{margin-top:24px}.field>.lbl{display:block;margin-bottom:10px}
.in{width:100%;min-height:52px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:0 16px;color:var(--tx);font:400 16px var(--sans);display:flex;align-items:center;gap:8px}
.in.big{font-family:var(--serif);font-size:24px}
.in.ph{color:var(--mu)}
.in.focus{border:2px solid #FFFFFF;padding:0 15px}
.in .caret{display:inline-block;width:2px;height:24px;background:#FFFFFF;margin-left:-6px}
.in .end{margin-left:auto;color:var(--mu);font-size:14px;font-family:var(--sans)}
.hint{font-size:13px;color:var(--mu);margin-top:8px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;min-width:56px;padding:0 16px;border-radius:999px;border:1px solid var(--ln);background:transparent;color:var(--tx);font:600 15px var(--sans);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.chip.on{background:#FFFFFF;color:#000000;border-color:#FFFFFF}
.chip.mini{margin-top:8px;font-weight:500;color:var(--mu)}
.chip.mini.on{color:#000}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sf);border:1px solid var(--ln);border-radius:999px;padding:4px;margin-bottom:8px}
.seg span{min-height:40px;border-radius:999px;display:grid;place-items:center;font-weight:600;font-size:15px;color:var(--mu)}
.seg span.on{background:#FFFFFF;color:#000}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.ic{aspect-ratio:1;min-height:44px;border-radius:16px;background:var(--sf);border:1px solid var(--ln);display:grid;place-items:center;font-size:26px}
.ic.on{border:2px solid #FFFFFF;background:#1F1F1F}
.radio{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;border:1px solid var(--ln);border-radius:16px;background:var(--sf);font-size:16px}
.radio+.radio{margin-top:8px}
.radio .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--mu);flex:none}
.radio.on{border-color:#FFFFFF}
.radio.on .dot{border-color:#FFFFFF;box-shadow:inset 0 0 0 4px var(--sf),inset 0 0 0 11px #FFFFFF}
.radio .r{margin-left:auto;color:var(--mu);font-size:14px;display:flex;align-items:center;gap:6px}
.stack{display:flex}.stack .av{border:2px solid var(--sf)}.stack .av+.av{margin-left:-8px}
.stack.onbg .av{border-color:var(--bg)}
.acts{margin-top:auto;padding-top:28px;display:flex;flex-direction:column;gap:10px}
.quiet{font-size:13px;text-align:center;margin-top:2px;color:var(--mu)}
.tag{font-size:12px;font-weight:600;border:1px solid var(--ln);border-radius:999px;padding:5px 10px}
.tag.draft{border-style:dashed;color:var(--mu)}
.picker{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;margin-top:14px;border-radius:999px;background:var(--sf);border:1px solid var(--ln);color:var(--tx);font:600 16px var(--sans)}
.picker .k{color:var(--mu);font-weight:400}.picker .car{color:var(--mu);font-size:13px;margin-left:2px}
.li{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--ln);font-size:16px;color:inherit;text-decoration:none}
.li:last-child{border-bottom:0}
.li .end{margin-left:auto;color:var(--mu);font-size:14px;display:flex;align-items:center;gap:8px}
.tile{width:56px;height:56px;border-radius:18px;background:#1F1F1F;display:grid;place-items:center;font-size:32px;flex:none}
.tile.sm{width:44px;height:44px;border-radius:14px;font-size:24px}
.tile.grey{filter:grayscale(.7);opacity:.7}
/* invitation page parts */
.host{display:flex;align-items:center;gap:10px;margin:8px 0 18px;font-size:15px}
.hero{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.hero .emo{font-size:56px;line-height:1}
.facts{background:var(--sf);border:1px solid var(--ln);border-radius:24px;padding:6px 16px}
.f{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--ln);font-size:15px;line-height:1.35}
.f:last-child{border-bottom:0}
.f .k{width:52px;flex:none;color:var(--mu);font-size:13px;padding-top:2px}
.f .sub{color:var(--mu);font-size:14px}
.cost{display:inline-block;border:1px solid var(--ln);border-radius:999px;padding:2px 10px;font-weight:600;font-size:14px}
.dl{display:flex;align-items:center;gap:8px;font-weight:600}
.dl i{width:7px;height:7px;border-radius:50%;background:var(--tx)}
.goingrow{margin-top:20px}
.people{display:flex;gap:16px;margin-top:10px}
.person{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px}
.person .av{width:52px;height:52px;font-size:28px}
.answer{margin-top:auto;padding-top:24px;display:flex;flex-direction:column;gap:10px}
.answer .btn{min-height:58px;font-size:18px}
.tiny{font-size:13px;text-align:center;margin-top:4px;color:var(--mu)}
.mine{display:flex;justify-content:space-between;align-items:center}
.small-hero{display:flex;align-items:center;gap:14px;margin:10px 0 14px}
.small-hero .emo{font-size:44px;line-height:1}
.line{font-size:14px;line-height:1.5}
.ylh{display:flex;justify-content:space-between;align-items:center;margin:20px 0 6px}
.yl{list-style:none}
.yl li{display:flex;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--ln);font-size:15px}
.yl li:last-child{border-bottom:0}
.yl .st{margin-left:auto;font-size:13px;color:var(--mu)}
.notes{margin-top:22px;border-top:1px solid var(--ln);padding-top:18px}
.nhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.nhead small{font-size:12px;color:var(--mu)}
.note{display:flex;gap:10px;margin-bottom:12px}
.note .bub{background:var(--sf);border:1px solid var(--ln);border-radius:4px 18px 18px 18px;padding:9px 13px;font-size:15px;line-height:1.35}
.note .nm{font-size:12px;color:var(--mu);margin-bottom:3px}
.compose{border:1px solid var(--ln);border-radius:20px;padding:12px 12px 10px 14px;margin-top:4px}
.compose .ta{color:var(--mu);font-size:15px;min-height:22px}
.cbar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px}
.send{min-height:44px;padding:0 18px;border-radius:999px;border:0;background:#FFFFFF;color:#000;font:600 15px var(--sans)}
.owner{margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:4px}
.statusb{display:flex;gap:12px;align-items:center;background:#1F1F1F;border:1px solid var(--ln);border-radius:16px;padding:12px 14px;font-weight:600;font-size:16px;line-height:1.3;margin:6px 0 18px}
.statusb small{display:block;font-weight:400;color:var(--mu);font-size:13px;margin-top:2px}
.statusb .ico{font-size:22px;flex:none}
.empty{border:1px solid var(--ln);border-radius:24px;padding:28px 20px 24px;text-align:center;position:relative;overflow:hidden}
.shapes{position:relative;height:96px;margin-bottom:14px}
.shapes span{position:absolute;opacity:.9}
.empty p{margin-top:6px;font-size:15px}


</style>
</head>
<body>
<header class="page-h">
  <h1>Invitation: other states</h1>
  <p>The same Invitation page in its quieter states: cancelled, closed, a Draft only the Inviter sees, and a plan with a time window instead of an exact time.</p>
</header>
<div class="row">

<figure>
  <div class="phone ">
    <div class="status"><span>19:50</span><span>●●● ▮</span></div>
    <a class="back" href="#">‹ Home</a>
    <div class="statusb"><span class="av s g0 sh0">🦊</span><div>Soroush cancelled this plan.<small>Notes stay open, if you want to chat.</small></div></div>
    <div class="small-hero"><span class="tile grey">🍔</span><h2 class="serif h-md">Burger tonight</h2></div>
    <p class="line mu">Fri 21 Nov, 20:00 · Burgeria da Gino, Via Roma 14 · $$</p>
    <div class="notes">
      <div class="nhead"><span class="lbl">Notes</span><small>Only people going see these</small></div>
      <div class="note"><span class="av s g0 sh0">🦊</span><div><div class="nm">Soroush · 19:48</div><div class="bub">Gino is closed tonight 😩 next week?</div></div></div>
      <div class="note"><span class="av s g1 sh1">🐸</span><div><div class="nm">Sara · 19:49</div><div class="bub">Next week for sure 🍔</div></div></div>
      <div class="compose"><div class="ta">Write a note…</div><div class="cbar"><span class="mu">0 / 280</span><button class="send">Send</button></div></div>
    </div>
  </div>
  <figcaption><b>a · Cancelled (seen by the Yes List)</b>A plain line on top says Soroush cancelled. The icon greys out. Notes stay open so friends can chat. Unanswered Invitees simply stop seeing it.</figcaption>
</figure>
<figure>
  <div class="phone ">
    <div class="status"><span>20:31</span><span>●●● ▮</span></div>
    <a class="back" href="#">‹ Home</a>
    <div class="statusb"><span class="ico" aria-hidden="true">⏱️</span><div>Answers are closed.<small>This one's done. No worries.</small></div></div>
    <div class="host"><span class="av s g0 sh0">🦊</span><span class="mu">Soroush invited you</span></div>
    <div class="hero"><span class="emo">🍔</span><h2 class="serif h-xl">Burger tonight</h2></div>
    <div class="facts">
      <div class="f"><span class="k">Where</span><div>Burgeria da Gino<div class="sub">Via Roma 14</div></div></div>
      <div class="f"><span class="k">When</span><div>Fri 21 Nov, 20:00</div></div>
      <div class="f"><span class="k">Cost</span><div><span class="cost">$$</span></div></div>
      <div class="f"><span class="k">Answer</span><div>Closed</div></div>
    </div>
    <div class="acts"><a class="btn ghost" href="#">Back to Home</a></div>
  </div>
  <figcaption><b>b · Closed, Ali never answered</b>Opened from an old link after the Deadline: "Answers are closed." No buttons, no Going row, no guilt.</figcaption>
</figure>
<figure>
  <div class="phone ">
    <div class="status"><span>19:32</span><span>●●● ▮</span></div>
    <div class="mine"><a class="back" href="#">‹ Home</a><span class="tag">Your plan</span></div>
    <div class="small-hero"><span class="emo">🍔</span><h2 class="serif h-md">Burger tonight</h2></div>
    <p class="line mu">Fri 21 Nov, 20:00 · Burgeria da Gino, Via Roma 14 · $$</p>
    <p class="line" style="margin-top:4px;font-weight:600">Answers closed</p>
    <div class="ylh"><span class="lbl">Yes List</span></div>
    <ul class="yl">
      <li><span class="av s g1 sh1">🐸</span>Sara<span class="st">is in</span></li>
      <li><span class="av s g2 sh2">🐻</span>Reza<span class="st">is in</span></li>
      <li><span class="av s g3 sh3">🐙</span>Ali<span class="st">is in</span></li>
    </ul>
    <div class="notes">
      <div class="nhead"><span class="lbl">Notes</span><small>Only you and people going</small></div>
      <div class="note"><span class="av s g1 sh1">🐸</span><div><div class="nm">Sara · 19:02</div><div class="bub">Meet at the door at 8?</div></div></div>
      <div class="compose"><div class="ta">Write a note…</div><div class="cbar"><span class="mu">0 / 280</span><button class="send">Send</button></div></div>
    </div>
    <div class="owner">
      <button class="btn ghost">Edit place or time</button>
      <button class="btn text">Cancel plan</button>
    </div>
  </div>
  <figcaption><b>c · Inviter, closed with Yes</b>"Answers closed" replaces the countdown and the live dot is gone. The final Yes List and Notes. Edit place or time stays until the plan starts; Cancel plan stays while the plan is Open or Closed.</figcaption>
</figure>
<figure>
  <div class="phone ">
    <div class="status"><span>19:31</span><span>●●● ▮</span></div>
    <div class="mine"><a class="back" href="#">‹ Home</a><span class="tag">Your plan</span></div>
    <div class="small-hero"><span class="emo">🍔</span><h2 class="serif h-md">Burger tonight</h2></div>
    <p class="line mu">Fri 21 Nov, 20:00 · Burgeria da Gino, Via Roma 14 · $$</p>
    <p class="line" style="margin-top:4px;font-weight:600">Answers closed</p>
    <div class="empty" style="margin-top:26px">
      <div class="shapes" aria-hidden="true">
        <span class="g2" style="width:58px;height:58px;border-radius:50% 50% 14px 14px;left:calc(50% - 96px);top:30px"></span>
        <span style="left:calc(50% - 34px);top:0;font-size:68px;opacity:1">🌙</span>
        <span class="g4" style="width:44px;height:44px;border-radius:50% 10px 50% 10px;left:calc(50% + 50px);top:40px"></span>
      </div>
      <h3 class="serif h-sm">Nobody is free tonight 🌙</h3>
      <p class="mu">Your plan is still on. Going solo works too.</p>
    </div>
    <div class="owner">
      <button class="btn ghost">Edit place or time</button>
      <button class="btn text">Cancel plan</button>
    </div>
  </div>
  <figcaption><b>d · Inviter, closed, nobody said Yes</b>A soft empty card: "Nobody is free tonight 🌙". Never "0 people". Kind line: the plan is still on.</figcaption>
</figure>
<figure>
  <div class="phone ">
    <div class="status"><span>21:10</span><span>●●● ▮</span></div>
    <div class="mine"><a class="back" href="#">‹ Home</a><span class="tag draft">Draft</span></div>
    <h2 class="serif h-lg" style="margin-top:8px">Your draft</h2>
    <p class="lead" style="margin-top:6px">Only you can see this.</p>
    <button class="picker"><span class="k">For:</span>Burger Gang 🍔<span class="car">▾</span></button>
    <div class="field"><span class="lbl">Pick an icon</span>
      <div class="icons"><span class="ic">🍔</span><span class="ic">🍣</span><span class="ic">🍕</span><span class="ic">☕</span><span class="ic on" aria-label="Movie, selected">🎬</span><span class="ic">🍺</span></div></div>
    <div class="field"><span class="lbl">What</span><div class="in big">Movie night</div></div>
    <div class="field"><span class="lbl">Where</span><div class="in ph" aria-disabled="true">Place, or decide later</div><button class="chip mini on" aria-pressed="true">Decide later</button></div>
    <div class="field"><span class="lbl">When</span>
      <div class="seg"><span>Exact time</span><span class="on">Time window</span></div>
      <div class="in">Sat 22 Nov</div>
      <div class="two"><div class="in">From 19:00</div><div class="in">To 22:00</div></div></div>
    <div class="field"><span class="lbl">Cost</span><div class="chips"><button class="chip">Free</button><button class="chip on">$</button><button class="chip">$$</button><button class="chip">$$$</button></div></div>
    <div class="field"><span class="lbl">Deadline</span><div class="chips"><button class="chip">10 min</button><button class="chip">30 min</button><button class="chip on">1 h</button><button class="chip">3 h</button></div></div>
    <div class="field"><span class="lbl">Who gets it</span>
      <div class="radio on"><span class="dot"></span>All members<span class="r"><span class="stack"><span class="av s g0 sh0">🦊</span><span class="av s g1 sh1">🐸</span><span class="av s g2 sh2">🐻</span></span>6</span></div>
      <div class="radio"><span class="dot"></span>Choose people<span class="r">›</span></div></div>
    <div class="acts">
      <button class="btn yes lg">Publish</button>
      <button class="btn ghost">Save as Draft</button>
      <button class="btn text">Delete draft</button>
    </div>
  </div>
  <figcaption><b>e · Draft (only the Inviter)</b>The New plan form, prefilled, with a dashed Draft tag. Publish (amber), Save as Draft, or Delete draft. Nobody is notified until Publish.</figcaption>
</figure>
<figure>
