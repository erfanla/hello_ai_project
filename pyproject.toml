[project]
name = "hello-ai-project"
version = "0.1.0"
description = "Low-pressure friend invite app"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.5",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "pwdlib[argon2]==0.3.1",
    "pydantic-settings==2.16.2",
    "python-multipart==0.0.33",
    "pywebpush==2.5.0",
    "sqlmodel==0.0.49",
    "uvicorn==0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]
